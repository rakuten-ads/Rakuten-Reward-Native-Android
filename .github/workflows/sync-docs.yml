name: Sync docs to pages

on:
  push:
    branches: [master, poc/auto_doc_sync]
    paths:
      - 'README.md'
      - 'doc/**/*.md'
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated source files to sync (e.g. "README.md doc/basic/LOGIN.md")'
        required: true
        default: 'README.md'

jobs:
  sync:
    runs-on: ra0319-local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed doc files
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.files }}" ]; then
            CHANGED="${{ github.event.inputs.files }}"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- README.md 'doc/**' \
              | grep '\.md$' \
              | grep -v 'doc/EventAnalytics\|doc/history\|doc/sps\|doc/java\|doc/lang' \
              | tr '\n' ' ')
          fi
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Skip if no relevant changes
        if: steps.changed.outputs.files == ''
        run: |
          echo "No relevant doc changes, skipping sync."

      - name: Clone pages repo
        if: steps.changed.outputs.files != ''
        env:
          PAT: ${{ secrets.SDK_PAGES_REPO_PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/Rakuten-Reward-SDK/Rakuten-Reward-SDK.github.io.git /tmp/pages-repo

      - name: Install Python dependencies
        if: steps.changed.outputs.files != ''
        run: pip3 install openai

      - name: Sync docs via AI
        if: steps.changed.outputs.files != ''
        env:
          RAKUTEN_AI_API_KEY: ${{ secrets.RAKUTEN_AI_API_KEY }}
          RAKUTEN_AI_MODEL: ${{ vars.RAKUTEN_AI_MODEL }}
          PAGES_REPO_DIR: /tmp/pages-repo
          NODE_EXTRA_CA_CERTS: /Users/zack.keng/Workstation/Github/netskope-root-ca.pem
        run: |
          python3 .github/scripts/sync_docs.py ${{ steps.changed.outputs.files }}

      - name: Create PR in pages repo
        if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.SDK_PAGES_REPO_PAT }}
        run: |
          cd /tmp/pages-repo
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          BRANCH="android-doc-sync-$(echo ${{ github.sha }} | cut -c1-7)"
          git checkout -b $BRANCH
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit — pages already up to date."
            exit 0
          fi
          git commit -m "sync: android docs from rakuten-ads/Rakuten-Reward-Native-Android@$(echo ${{ github.sha }} | cut -c1-7)"
          git push origin $BRANCH
          gh pr create \
            --repo Rakuten-Reward-SDK/Rakuten-Reward-SDK.github.io \
            --title "sync: android docs from $(echo ${{ github.sha }} | cut -c1-7)" \
            --body "Auto-synced from commit ${{ github.sha }} in [rakuten-ads/Rakuten-Reward-Native-Android](https://github.com/rakuten-ads/Rakuten-Reward-Native-Android/commit/${{ github.sha }})." \
            --base master
